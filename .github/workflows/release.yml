name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.bump.outputs.next_version }}
      short_sha: ${{ steps.bump.outputs.short_sha }}
      skip: ${{ steps.bump.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Compute next version
        id: bump
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            # Check if the current commit is already tagged — skip if so
            TAGGED_SHA=$(git rev-list -n 1 "$LAST_TAG" 2>/dev/null || echo "")
            CURRENT_SHA=$(git rev-parse HEAD)
            if [ "$TAGGED_SHA" = "$CURRENT_SHA" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "next_version=${LAST_TAG#v}" >> "$GITHUB_OUTPUT"
              echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
              echo "Head already tagged as $LAST_TAG — skipping release."
              exit 0
            fi
            # Strip leading v, split on dots
            BASE="${LAST_TAG#v}"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            if [ "$PATCH" -gt 99 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
            if [ "$MINOR" -gt 99 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Next version: v$NEXT_VERSION (sha $SHORT_SHA)"

      - name: Push tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          TAG="v${{ steps.bump.outputs.next_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally — skipping creation"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

      - name: Generate changelog
        if: steps.bump.outputs.skip != 'true'
        id: changelog
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "v${{ steps.bump.outputs.next_version }}"^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          {
            echo "body<<EOF"
            echo "## What's new"
            echo
            git log --pretty=format:"- %s (%h)" "$RANGE" | grep -v -iE "^(chore|test): bump|^[a-f0-9]+ - (Merge pull request|Merge branch)" || true
            echo
            echo
            echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...v${{ steps.bump.outputs.next_version }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.next_version }}" \
            --title "v${{ steps.bump.outputs.next_version }}" \
            --notes "${{ steps.changelog.outputs.body }}" \
            --target main

  # Build each architecture natively in parallel (public repos get free
  # GitHub-hosted ARM runners), push by digest, then merge into one
  # multi-arch manifest. Replaces the QEMU cross-build that intermittently
  # hung for hours under emulation.
  build:
    needs: bump-version
    if: needs.bump-version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=emreyc/taskforge,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [bump-version, build]
    if: needs.bump-version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tag variants
        id: tags
        env:
          NEXT_VERSION: ${{ needs.bump-version.outputs.next_version }}
        run: |
          set -euo pipefail
          MAJOR=$(echo "$NEXT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$NEXT_VERSION" | cut -d. -f1,2)
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        env:
          NEXT_VERSION: ${{ needs.bump-version.outputs.next_version }}
          SHORT_SHA: ${{ needs.bump-version.outputs.short_sha }}
          MAJOR: ${{ steps.tags.outputs.major }}
          MINOR: ${{ steps.tags.outputs.minor }}
        run: |
          docker buildx imagetools create \
            -t emreyc/taskforge:latest \
            -t "emreyc/taskforge:${NEXT_VERSION}" \
            -t "emreyc/taskforge:${MINOR}" \
            -t "emreyc/taskforge:${MAJOR}" \
            -t "emreyc/taskforge:sha-${SHORT_SHA}" \
            $(printf 'emreyc/taskforge@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect emreyc/taskforge:latest
